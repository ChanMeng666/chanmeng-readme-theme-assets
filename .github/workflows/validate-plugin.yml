name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code validates the plugin and marketplace
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
          npx -y @anthropic-ai/claude-code plugin validate --strict .
